name: Deploy to GitHub Pages

# 運用方針:
# 日記mdの source はこのリポジトリ外（ローカルの C:\ClaudeCode\note-diary）にあるため、
# ビルド（python build_blog.py）はローカルで実行し、生成物（blog/ 等）をコミットする。
# Actions 側ではビルドせず、コミット済みの静的ファイルをそのまま Pages へ公開する。
# これにより「手動ビルド→commit」フローと二重ビルドにならず整合する。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
