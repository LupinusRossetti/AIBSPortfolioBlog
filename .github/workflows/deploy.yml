name: Deploy to GitHub Pages

# 運用方針:
# 日記mdの source はこのリポジトリ外（ローカルの C:\ClaudeCode\note-diary）にあるため、
# ビルド（python build_blog.py）はローカルで実行し、生成物（blog/ 等）をコミットする。
# Actions 側ではビルドせず、コミット済みの静的ファイルをそのまま Pages へ公開する。
# これにより「手動ビルド→commit」フローと二重ビルドにならず整合する。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # artifact 1GB超過対策（2026-07-14）: ソース（note-diary/ 1.1GB・スクリプト類）は
      # 公開に不要なので、サイト実体だけを _site へ集めてアップロードする。
      # 参照実体は blog/ と images/ （note-diary の画像は build_blog.py が blog/ へコピー済み）。
      - name: Collect public site files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='_site' \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='note-diary' \
            --exclude='*.py' \
            --exclude='README.md' \
            --exclude='pilots.html' \
            ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
